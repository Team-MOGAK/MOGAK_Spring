spring:
  config:
    activate:
      on-profile: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5435/mogak_local}
    username: ${LOCAL_DB_USERNAME:mogak}
    password: ${LOCAL_DB_PASSWORD:mogak}
    driver-class-name: org.postgresql.Driver
  devtools:
    livereload:
      enabled: true
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        #        show_sql: true
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: file:./sql/seed/*.sql
logging.level:
  org.hibernate.SQL: debug
  org.hibernate.type: trace

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /**
  use-fqn: true

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiry: 7200000 #2시간
  refresh-token-expiry: 2678400000 #31일

server:
  domain: ${SERVER_DOMAIN:http://localhost:8080}

feign:
  client:
    config:
      apple-public-key-client:
        connect-timeout: 5000
        read-timeout: 3000

oauth:
  apple:
    iss: https://appleid.apple.com
    client-id: ${APPLE_CLIENT_ID:test-client-id}
#    nonce: ${APPLE_NONCE}

feature:
  storage:
    enabled: false

