spring:
  config:
    activate:
      on-profile: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${APP_DB_URL:${url}}
    username: ${APP_DB_USERNAME:${rds_username}}
    password: ${APP_DB_PASSWORD:${rds_password}}
    hikari:
      data-source-properties:
        # Disable session-local named statements for Supavisor transaction mode (port 6543).
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        #        show_sql: true
        format_sql: true
logging.level:
  org.hibernate.SQL: debug
  org.hibernate.type: trace
logging:
  file:
    path: ${LOG_PATH:./logs}
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS,Asia/Seoul


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /**
  use-fqn: true
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiry: 900000 #15분
  refresh-token-expiry: 2678400000 #31일


server:
  domain: ${SERVER_DOMAIN:http://localhost:8080}
  port: ${PORT:8080}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:}
    key-store-type: ${SSL_KEY_TYPE:}
    key-store-password: ${SSL_KEY_PW:}

feign:
  client:
    config:
      apple-public-key-client:
        connectTimeout: 5000
        readTimeout: 3000

oauth:
  apple:
    iss: https://appleid.apple.com
    client-ids: ${APPLE_CLIENT_IDS:${APPLE_CLIENT_ID}}
  google:
    iss: https://accounts.google.com
    client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID}}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  kakao:
    user-info-uri: https://kapi.kakao.com
#    nonce: ${APPLE_NONCE}

feature:
  storage:
    enabled: false

